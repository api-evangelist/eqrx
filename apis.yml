name: EQRx
description: >-
  EQRx was a biopharmaceutical company based in Cambridge, Massachusetts, founded in 2020
  by Alexis Borisy with a mission to develop and deliver innovative, patent-protected
  medicines at radically lower prices. The company went public in 2021 through a SPAC merger
  with CM Life Sciences III and built an oncology and immunology pipeline anchored by in-licensed
  candidates such as aumolertinib and sugemalimab. In 2023 EQRx wound down its drug-development
  programs and was acquired by Revolution Medicines in an all-stock transaction. It was surfaced
  in the API Evangelist network as a portfolio-company lead (backed by a16z and GV); it never
  operated a public developer platform or API, and its web presence is no longer live.
